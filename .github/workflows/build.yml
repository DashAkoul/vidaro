name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.2.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (MSI + NSIS)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            node_modules
          key: ${{ runner.os }}-vidaro-${{ hashFiles('**/Cargo.lock', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vidaro-

      - name: Download Windows binaries (yt-dlp, ffmpeg, ffprobe)
        shell: pwsh
        run: |
          $binDir = "src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          
          # yt-dlp
          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$binDir/yt-dlp.exe"
          
          # ffmpeg (static build with ffmpeg.exe + ffprobe.exe)
          $ffmpegZip = "$binDir/ffmpeg.zip"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" -OutFile $ffmpegZip
          Expand-Archive -Force -Path $ffmpegZip -DestinationPath "$binDir/_ffmpeg"
          # Find and copy ffmpeg.exe and ffprobe.exe from extracted folder
          $ffmpegExe = Get-ChildItem -Path "$binDir/_ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path "$binDir/_ffmpeg" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if ($ffmpegExe) { Copy-Item -Force $ffmpegExe.FullName "$binDir/ffmpeg.exe" }
          if ($ffprobeExe) { Copy-Item -Force $ffprobeExe.FullName "$binDir/ffprobe.exe" }
          Remove-Item -Force -Recurse "$binDir/_ffmpeg"
          Remove-Item -Force $ffmpegZip
          
          Write-Host "Binaries downloaded to $binDir"
          Get-ChildItem $binDir

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri App (Windows)
        run: npm run tauri build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: vidaro-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  build-macos:
    name: Build macOS (DMG + .app)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            node_modules
          key: ${{ runner.os }}-vidaro-${{ hashFiles('**/Cargo.lock', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vidaro-

      - name: Download macOS binaries (yt-dlp, ffmpeg, ffprobe)
        run: |
          BIN_DIR="src-tauri/binaries"
          mkdir -p "$BIN_DIR"
          
          # yt-dlp (universal)
          curl -L -o "$BIN_DIR/yt-dlp" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
          chmod +x "$BIN_DIR/yt-dlp"
          
          # ffmpeg + ffprobe from evermeet.cx
          for tool in ffmpeg ffprobe; do
            curl -L -o "$BIN_DIR/${tool}.zip" "https://evermeet.cx/ffmpeg/get/${tool}/zip"
            unzip -o "$BIN_DIR/${tool}.zip" -d "$BIN_DIR"
            rm "$BIN_DIR/${tool}.zip"
            chmod +x "$BIN_DIR/$tool"
          done
          
          echo "Binaries downloaded to $BIN_DIR"
          ls -la "$BIN_DIR"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri App (macOS Universal)
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidaro-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          retention-days: 30

  build-linux:
    name: Build Linux (AppImage + Deb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-4-dev \
            libadwaita-1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            node_modules
          key: ${{ runner.os }}-vidaro-${{ hashFiles('**/Cargo.lock', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vidaro-

      - name: Download Linux binaries (yt-dlp, ffmpeg, ffprobe)
        run: |
          BIN_DIR="src-tauri/binaries"
          mkdir -p "$BIN_DIR"
          
          # yt-dlp
          curl -L -o "$BIN_DIR/yt-dlp" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux"
          chmod +x "$BIN_DIR/yt-dlp"
          
          # ffmpeg static build
          curl -L -o ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz"
          tar -xf ffmpeg.tar.xz -C /tmp
          # Find and copy ffmpeg and ffprobe
          find /tmp -name "ffmpeg" -type f -executable | head -1 | xargs -I {} cp {} "$BIN_DIR/ffmpeg"
          find /tmp -name "ffprobe" -type f -executable | head -1 | xargs -I {} cp {} "$BIN_DIR/ffprobe"
          chmod +x "$BIN_DIR/ffmpeg" "$BIN_DIR/ffprobe"
          rm -rf ffmpeg.tar.xz /tmp/ffmpeg-*
          
          echo "Binaries downloaded to $BIN_DIR"
          ls -la "$BIN_DIR"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri App (Linux)
        run: npm run tauri build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidaro-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "=== Artifacts downloaded ==="
          find artifacts -type f -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.app" -o -name "*.AppImage" -o -name "*.deb" | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vidaro ${{ github.ref_name }}
          body: |
            ## Vidaro ${{ github.ref_name }}

            ### Changes
            - YouTube video, playlist & channel downloader
            - Multi-platform: Windows, macOS, Linux
            - Queue management with pause/resume/cancel/retry
            - Global & per-item scheduler
            - Import/Export queue & settings
            - Proxy support (HTTP/HTTPS/SOCKS5)
            - Clipboard watcher with toast notification
            - Dark/Light/System theme, RTL support

            ### Files
            **Windows:**
            - `Vidaro_${{ github.ref_name }}_x64-setup.exe` (NSIS Installer)
            - `Vidaro_${{ github.ref_name }}_x64_en-US.msi` (Windows Installer)

            **macOS (Universal - Intel + Apple Silicon):**
            - `Vidaro_${{ github.ref_name }}_universal.dmg` (DMG Installer)
            - `Vidaro_${{ github.ref_name }}_universal.app.zip` (App Bundle)

            **Linux:**
            - `Vidaro_${{ github.ref_name }}_amd64.AppImage` (Portable)
            - `Vidaro_${{ github.ref_name }}_amd64.deb` (Debian/Ubuntu)

          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.app
            artifacts/**/*.AppImage
            artifacts/**/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}