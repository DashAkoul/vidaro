<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidaro - Download</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .download-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .download-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .back-btn:hover {
      background: var(--surface);
      border-color: var(--primary);
      color: var(--primary);
    }
    
    .download-header-content {
      flex: 1;
    }
    
    .download-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    
    .download-url {
      font-size: 12px;
      color: var(--text-muted);
      word-break: break-all;
    }
    
    .close-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 50%;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
    }
    
    .close-btn:hover {
      background: var(--surface);
      color: var(--error);
    }
    
    .download-content {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    
    .video-preview {
      display: flex;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    
    .video-thumbnail {
      width: 240px;
      height: 135px;
      flex-shrink: 0;
      border-radius: 8px;
      object-fit: cover;
      background: var(--surface);
    }
    
    .video-info {
      flex: 1;
      min-width: 0;
    }
    
    .video-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.3;
    }
    
    .video-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--text-muted);
    }
    
    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .meta-icon {
      width: 16px;
      height: 16px;
      opacity: 0.7;
    }
    
    .download-options {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }
    
    .option-section {
      margin-bottom: 24px;
    }
    
    .option-section:last-child {
      margin-bottom: 0;
    }
    
    .option-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
    }
    
    .option-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      gap: 16px;
    }
    
    .option-field {
      flex: 1;
      min-width: 180px;
    }
    
    .option-field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    
    .option-field select,
    .option-field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      transition: var(--transition);
    }
    
    .option-field select:focus,
    .option-field input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }
    
    .download-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      margin-top: 8px;
    }
    
    .download-progress {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .progress-title {
      font-weight: 600;
      color: var(--text);
    }
    
    .progress-percent {
      font-family: monospace;
      font-weight: 600;
      color: var(--primary);
      font-size: 14px;
    }
    
    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 99px;
      transition: width 0.3s ease;
      width: 0%;
    }
    
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }
    
    .progress-speed,
    .progress-eta {
      font-family: monospace;
      font-size: 12px;
    }
    
    .progress-status {
      font-size: 12px;
      color: var(--text-muted);
      min-height: 16px;
    }
    
    .btn-icon {
      width: 18px;
      height: 18px;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .downloading .download-btn {
      pointer-events: none;
    }
    
    .downloading .btn-text {
      display: none;
    }
    
    .downloading .btn-loader {
      display: inline-block !important;
    }
  </style>
</head>
<body>
  <div class="download-page">
    <header class="download-header">
      <button class="back-btn" id="back-btn" title="Back to YouTube">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>Back to YouTube</span>
      </button>
      <div class="download-header-content">
        <h1 class="download-title" id="video-title">Loading...</h1>
        <div class="download-url" id="video-url"></div>
      </div>
      <button class="close-btn" id="close-btn" title="Close" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>
    
    <main class="download-content">
      <div class="video-preview" id="video-preview" style="display: none;">
        <img class="video-thumbnail" id="video-thumbnail" alt="Video thumbnail">
        <div class="video-info">
          <h2 class="video-title" id="video-title">Loading...</h2>
          <div class="video-meta">
            <div class="meta-item">
              <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span id="video-author">Loading...</span>
            </div>
            <div class="meta-item">
              <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 8v4l3 3"></path>
                <circle cx="12" cy="12" r="10"></circle>
              </svg>
              <span id="video-duration">--:--</span>
            </div>
            <div class="meta-item">
              <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span id="video-views">-- views</span>
            </div>
          </div>
        </div>
      </div>
      
      <div class="download-options" id="download-options">
        <div class="option-section">
          <span class="option-label">Format</span>
          <div class="option-row">
            <div class="option-field">
              <label>Format</label>
              <select id="format-select">
                <option value="mp4">Video (MP4)</option>
                <option value="mp3">Audio Only (MP3)</option>
              </select>
            </div>
            <div class="option-field" id="quality-field">
              <label>Quality</label>
              <select id="quality-select">
                <option value="best">Best Available</option>
                <option value="4320">8K (4320p)</option>
                <option value="2160">4K (2160p)</option>
                <option value="1440">2K (1440p)</option>
                <option value="1080">Full HD (1080p)</option>
                <option value="720">HD (720p)</option>
                <option value="480">SD (480p)</option>
                <option value="360">Low (360p)</option>
              </select>
            </div>
          </div>
        </div>
        
        <div class="option-section">
          <span class="option-label">Additional Options</span>
          <div class="option-row">
            <label class="option-field" style="flex: 1; display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="checkbox" id="embed-thumbnail">
              <span style="font-size: 13px; color: var(--text);">Embed thumbnail</span>
            </label>
            <label class="option-field" style="flex: 1; display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="checkbox" id="embed-metadata">
              <span style="font-size: 13px; color: var(--text);">Embed metadata</span>
            </label>
            <label class="option-field" style="flex: 1; display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="checkbox" id="write-subs">
              <span style="font-size: 13px; color: var(--text);">Download subtitles</span>
            </label>
          </div>
          <div class="option-field" id="sub-langs-field" style="display: none;">
            <label>Subtitle languages</label>
            <input type="text" id="sub-langs" placeholder="en,fr,es..." style="width: 100%;">
          </div>
        </div>
      </div>
      
      <div class="download-actions">
        <button class="btn btn-secondary" id="cancel-btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          <span>Cancel</span>
        </button>
        <button class="btn btn-primary download-btn" id="download-btn">
          <span class="btn-text">Start Download</span>
          <span class="btn-loader hidden">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
              <path d="M12 2a10 10 0 0 1 10 10" stroke-width="3" stroke-linecap="round">
                <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/>
              </path>
            </svg>
          </span>
        </button>
      </div>
      
      <div class="download-progress" id="download-progress" style="display: none;">
        <div class="progress-header">
          <span class="progress-title" id="progress-title">Downloading...</span>
          <span class="progress-percent" id="progress-percent">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-info">
          <span class="progress-speed" id="progress-speed">-- KB/s</span>
          <span class="progress-eta" id="progress-eta">ETA: --:--</span>
        </div>
        <div class="progress-status" id="progress-status">Preparing download...</div>
      </div>
    </main>
    
    <script src="download-page.js"></script>
  </div>
</body>
</html>
