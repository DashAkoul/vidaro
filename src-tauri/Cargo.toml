[package]
name = "vidaro"
version = "2.0.0"
description = "Vidaro - YouTube video, playlist & channel downloader"
authors = ["DashAkoul"]
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix is required on Windows to avoid a name clash with the binary.
name = "vidaro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

tokio = { version = "1", features = ["process", "io-util", "macros", "sync", "time", "fs"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
arboard = "3"

# Login-item registration writes HKCU\...\Run directly so the command line can
# carry `--hidden` (see features/system/autostart.rs).
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
codegen-units = 1
# `lto = false` keeps the `ring` crate (pulled in by rustls) from failing to
# link on MSVC. See CHANGELOG for details.
lto = false
opt-level = 3
panic = "abort"
strip = true
